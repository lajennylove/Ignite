<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>
  Dashboard
 · Ignite</title>
<link rel="icon" href="/admin/build/resources/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/admin/build/resources/images/favicon-32.png">
<link rel="apple-touch-icon" href="/admin/build/resources/images/apple-touch-icon.png">
<link rel="stylesheet" href="/admin/build/assets/app-2xZ_wrmi.css">
<script type="module" src="/admin/build/assets/app-Doh2sRhG.js"></script>

</head>
<body class="min-h-screen bg-page font-sans text-text antialiased">

  
<input id="ig-nav" type="checkbox" class="peer sr-only">
<aside class="fixed inset-y-0 left-0 z-30 flex w-[270px] -translate-x-full flex-col overflow-y-auto border-r border-border bg-surface transition-transform duration-300 peer-checked:translate-x-0 xl:translate-x-0">
  <a class="flex items-center gap-2.5 px-6 py-6 font-semibold text-heading no-underline" href="/admin">
    <img src="/admin/build/resources/images/ignite-mark.png" alt="" class="h-9 w-auto">
    <span class="text-xl">Ignite</span>
  </a>
  <nav class="flex flex-col gap-1 px-4 pb-6" aria-label="Main">
    <p class="ig-caption mt-2">Menu</p>
    
      
        <a class="ig-nav-link ig-nav-link-active" href="/admin" aria-current="page"><i class="ti ti-layout-dashboard text-lg"></i>Dashboard</a>
      
    
      <div class="flex flex-col gap-1" data-ig-nav-item>
      <div class="flex items-center gap-1">
      
        <a class="ig-nav-link" href="/admin/widgets"><i class="ti ti-table text-lg"></i>Widgets</a>
      
        <button type="button" class="ig-nav-link shrink-0" aria-expanded="false" aria-controls="ig-nav-items-0-1" aria-label="Widgets menu" data-ig-nav-item-toggle><i class="ti ti-chevron-down text-lg transition-transform" aria-hidden="true"></i></button>
      </div>
      <div id="ig-nav-items-0-1" class="flex flex-col gap-1" hidden>
      
        <a class="ig-nav-link py-1.5 pl-11 text-[13px]" href="/admin/widgets/new">Add new</a>
      
      </div>
      </div>
      
    
  </nav>
  <style>[data-ig-nav-item] > div > a { flex: 1 1 0%; min-width: 0; } [data-ig-nav-item-toggle][aria-expanded="false"] i { transform: rotate(-90deg); }</style>
  <script>
  // A navigation entry's group, as a WordPress menu with its submenu: the toggle beside the
  // entry shows or hides its create link and its child entries. The group of the current page
  // starts open; without JavaScript it is the only one that shows its links.
  document.querySelectorAll('[data-ig-nav-item-toggle]').forEach((button) => {
    button.addEventListener('click', () => {
      const open = button.getAttribute('aria-expanded') !== 'true';
      button.setAttribute('aria-expanded', String(open));
      document.getElementById(button.getAttribute('aria-controls')).hidden = !open;
    });
  });
  </script>
</aside>



<div class="flex min-h-screen min-w-0 flex-col ig-with-sidebar">
  
  <header class="sticky top-0 z-20 flex items-center border-b border-border bg-page px-5 py-3">
    <div class="flex w-full items-center gap-4">
  
    <label for="ig-nav" class="ig-btn ig-btn-ghost h-10 w-10 px-0 xl:hidden" aria-label="Open the menu"><i class="ti ti-menu-2 text-xl"></i></label>
    <a class="flex items-center gap-2.5 font-semibold text-heading no-underline hover:underline" href="/admin/profile"><span class="flex h-9 w-9 items-center justify-center rounded-full bg-lightprimary text-sm font-semibold text-primary">A</span>Admin</a>
    <div class="ml-auto flex items-center gap-2">
      <button type="button" class="ig-btn ig-btn-outline h-10 w-10 px-0" data-theme-toggle data-theme="light" data-theme-url="/admin/theme" data-csrf="{csrf}" aria-label="Switch theme">
        <i class="ti ti-moon ig-theme-moon text-lg"></i>
        <i class="ti ti-sun ig-theme-sun text-lg"></i>
      </button>
      <form method="post" action="/admin/logout-everywhere">
        <input type="hidden" name="_token" value="{csrf}">
        <button type="submit" class="ig-btn ig-btn-outline">Sign out</button>
      </form>
    </div>
  
</div>

  </header>

  <main class="mx-auto w-full max-w-[1536px] flex-1 px-5 py-6">
    
  


    
  <section class="ig-card mb-6 bg-lightprimary shadow-none">
    <h1 class="mb-1 text-2xl">Welcome back, Admin</h1>
    <p class="m-0">Here is what is happening in your panel.</p>
  </section>

  <div class="grid gap-5 [grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))]">
    
      <div class="ig-card ig-tone-primary flex flex-col items-center gap-2 text-center shadow-none">
        <i class="ti ti-users text-4xl"></i>
        <p class="m-0 font-semibold">Widgets</p>
        <p class="m-0 text-2xl font-semibold">3</p>
      </div>
    
  </div>

  
    <section class="ig-card mt-8 p-0">
      <h2 class="px-6 pt-6 pb-4">Latest widgets</h2>
      <div class="overflow-x-auto">
        <table class="ig-table">
          <thead>
            <tr>
              
                <th>Name</th>
              
                <th>Price</th>
              
            </tr>
          </thead>
          <tbody>
            
              <tr>
                
                  <td>Cherry</td>
                
                  <td>2</td>
                
              </tr>
            
              <tr>
                
                  <td>Banana</td>
                
                  <td>1</td>
                
              </tr>
            
          </tbody>
        </table>
      </div>
    </section>
  

  </main>
</div>
</body>
</html>
