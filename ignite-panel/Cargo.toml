[package]
name = "ignite-panel"
version = "0.5.0"
license = "MIT"
description = "The Ignite admin panel for Rocket.rs, built on Propel views and Orbit."
repository = "https://github.com/lajennylove/Ignite"
edition = "2021"
# Lets an app's build script read the views directory from DEP_IGNITE_PANEL_VIEWS_DIR.
links = "ignite_panel"

# The database drivers beside MySQL and MariaDB, which Orbit always builds, forwarded to it.
[features]
postgres = ["orbit-orm/postgres"]
sqlite = ["orbit-orm/sqlite"]

[dependencies]
ignite-core = { version = "0.5.0", path = "../ignite-core" }
rocket = "0.5.2"
propel_rocket = "0.3.0"
propel_runtime = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1"
chrono = { version = "0.4", features = ["serde"] }
orbit-orm = "0.4.0"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rpassword = "7"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[build-dependencies]
propel_compiler = "0.3.0"

# Rocket reports TLS only when its `tls` feature is on, so the tests that configure TLS need it.
[dev-dependencies]
rocket = { version = "0.5.2", features = ["tls"] }

[[bin]]
name = "ignite"
path = "src/bin/ignite.rs"
