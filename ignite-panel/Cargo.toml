[package]
name = "ignite-panel"
version = "0.0.0"
edition = "2021"
publish = false
# Lets an app's build script read the views directory from DEP_IGNITE_PANEL_VIEWS_DIR.
links = "ignite_panel"

[dependencies]
ignite-core = { path = "../ignite-core" }
rocket = { git = "https://github.com/rwf2/Rocket", rev = "3a54d079" }
propel_rocket = { git = "https://github.com/lajennylove/propel", rev = "72e9202d699862b75771967beb8d900400b6114c" }
propel_runtime = { git = "https://github.com/lajennylove/propel", rev = "72e9202d699862b75771967beb8d900400b6114c" }
diesel = { git = "https://github.com/lajennylove/diesel", rev = "a07c4b2c20a466ef34f50ca283790f4df20b0699", features = ["mysql", "r2d2", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1"
chrono = { version = "0.4", features = ["serde"] }
diesel_migrations = { git = "https://github.com/lajennylove/diesel", rev = "a07c4b2c20a466ef34f50ca283790f4df20b0699" }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rpassword = "7"
dotenvy = "0.15"

[build-dependencies]
propel_compiler = { git = "https://github.com/lajennylove/propel", rev = "72e9202d699862b75771967beb8d900400b6114c" }

[[bin]]
name = "ignite"
path = "src/bin/ignite.rs"
