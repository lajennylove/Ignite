[package]
name = "ignite-panel"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
ignite-core = { path = "../ignite-core" }
rocket = { git = "https://github.com/rwf2/Rocket", rev = "3a54d079" }
propel_rocket = { git = "https://github.com/lajennylove/propel", rev = "1853048" }
diesel = { version = "2", features = ["mysql", "r2d2", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1"
